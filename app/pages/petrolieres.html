<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DB Fuel - Nadeau</title>
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
    <header>
        <div>
            <h1>DB Fuel - Nadeau</h1>
        </div>
        <div class="user-info">
            {{.Username}}
            <span class="role-badge {{.Role}}">{{.Role}}</span>
        <form action="/logout" method="POST">
        <!-- CSRF Token for logout -->
        <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}" />
        <button type="submit" class="logout-btn">Logout</button>
        </div>
    </form>
  </header>
  <br>
  
  <section id="content">
        <h2>Bienvenue {{.Username}}</h2> 
        {{if .IsAdmin}}
        <div class="admin-section">
            <h3>Admin Panel</h3>
            <p>You have admin access. You can manage:</p>
            <nav>
              <a href="/admin">Admin Dashboard</a>
                <a href="/admin/users">Manage Users</a>
                <a href="/admin/syncruns">View last syncruns</a>
              </nav>
        </div>
        {{end}}
        <h4>Navigation</h4>
        
        <nav class="tabs">
          <a href="/chauffeurs"    class="tab">Chauffeurs</a>
    <a href="/cartes"        class="tab">Cartes</a>
    <a href="/transactions"  class="tab">Transactions</a>
    <a href="/petrolieres"   class="tab active">Pétrolières</a>
    <a href="/vehicules"     class="tab">Véhicules</a>
    <a href="/brokers"       class="tab">Compagnies Broker</a>
  </nav>
</section>


<main class="container">
  <!-- Filters -->
  <section class="panel">
    <div>
      <label for="f-name">Pétrolière</label>
      <input type="text" id="f-name" placeholder="ex.: Harnois">
            </div>
      <div class="spacer"></div>
      <span id="count" style="opacity:.7;"></span>
    </section>

    <!-- Table -->
    <section class="panel">
      <table id="tbl" class="table">
        <thead>
          <tr>
            <th>Pétrolière</th>
            <th>Compte</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script>
    const state = { data: [] };

    // Fetch ALL once (small table)
    async function loadAll() {
      const res = await fetch('/api/petrolieres/all', { headers: { 'Accept': 'application/json' } });
      if (!res.ok)throw new Error('HTTP ' + res.status);
      state.data = await res.json();
    }

    // Apply client-side filter
    function applyFilter() {
      const name = (document.getElementById('f-name').value || '').trim().toLowerCase();
      
      let rows = state.data;
      if (name) rows = rows.filter(r => (r.OilCoName || '').toLowerCase().includes(name));
      
      render(rows);
    }

    // Render table
    function render(rows) {
      const tb = document.querySelector('#tbl tbody');
      tb.innerHTML = '';
      rows.forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${r.OilCoName ?? ''}</td>
          <td>${r.Compte ?? ''}</td>
          `;
          // Add click listener to toggle selection
        tr.addEventListener('click', function() {
          this.classList.toggle('selected');
        });
        tb.appendChild(tr);
      });
      document.getElementById('count').textContent = rows.length + ' résultat(s)';
    }
    
    
    // Init
    (async function init() {
      try {
        await loadAll();
        applyFilter();
        document.getElementById('f-name').addEventListener('input', applyFilter);
      } catch (e) {
        alert('Erreur chargement: ' + e.message);
      }
    })();
    </script>
</body>




</html>
