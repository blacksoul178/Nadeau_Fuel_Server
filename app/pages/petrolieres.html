<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{.CSRFToken}}">
    <title>Fuel'O'Matic - Pétrolières</title>
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
 {{template "header" .}}



<main class="container">
    <!-- Ajout de Pétrolière -->
    <section class="panel">
          <b>Ajout Pétrolière</b>
          <div>
            <label for="oilCoName">Nom de la Pétrolière *</label>
            <input type="text" name="oilCoName" id="oilCoName" placeholder="ex.: Harnois">
          </div>
          <div>
            <label for="compte">Compte *</label>
            <input type="text" name="compte" id="compte" placeholder="ex.: ACC12345">
          </div>
          <div>
            <label for="banner">Bannière (optionnel)</label>
            <input type="text" name="banner" id="banner" placeholder="ex.: HARNOIS">
          </div>
          <button type="submit" class="AjouterOilCo">Ajouter</button>
    </section>
  </main>

<main class="container">
  <!-- Filters -->
  <section class="panel">
    <div>
      <label for="f-name">Pétrolière</label>
      <input type="text" id="f-name" placeholder="ex.: Harnois">
            </div>
      <div class="spacer"></div>
      <span id="count" style="opacity:.7;"></span>
    </section>

    <!-- Table -->
    <section class="panel">
      <table id="tbl" class="table">
        <thead>
          <tr>
            <th>Pétrolière</th>
            <th>Compte</th>
            <th>Bannière</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script>
    const state = { data: [] };

    // Fetch ALL once (small table)
    async function loadAll() {
      const res = await fetch('/api/petrolieres/allPetrolieres', { headers: { 'Accept': 'application/json' } });
      if (!res.ok)throw new Error('HTTP ' + res.status);
      state.data = await res.json();
    }

    // Apply client-side filter
    function applyFilter() {
      const name = (document.getElementById('f-name').value || '').trim().toLowerCase();
      
      let rows = state.data;
      if (name) rows = rows.filter(r => (r.OilCoName || '').toLowerCase().includes(name));
      
      render(rows);
    }

    // Render table
    function render(rows) {
      const tb = document.querySelector('#tbl tbody');
      tb.innerHTML = '';
      rows.forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${r.OilCoName ?? ''}</td>
          <td>${r.Compte ?? ''}</td>
          <td>${r.Banner ?? ''}</td>
          `;
          // Add click listener to toggle selection
        tr.addEventListener('click', function() {
          this.classList.toggle('selected');
        });
        tb.appendChild(tr);
      });
      document.getElementById('count').textContent = rows.length + ' résultat(s)';
    }

    // Helper to read CSRF token
    function getCSRF() {
      const m = document.querySelector('meta[name="csrf-token"]');
      if (m && m.content) return m.content;
      // fallback to cookie
      const v = document.cookie.split(';').map(s => s.trim()).find(s => s.startsWith('csrf_token='));
      if (v) return v.split('=')[1];
      return '';
    }

    // Add OilCo - submit handler
    async function addOilCo() {
      const oilCoName = document.getElementById('oilCoName').value;
      const compte = document.getElementById('compte').value;
      const banner = document.getElementById('banner').value;

      if (!oilCoName) { alert('Veuillez entrer le nom de la pétrolière.'); return; }
      if (!compte) { alert('Veuillez entrer le compte.'); return; }

      const payload = {
        OilCoName: oilCoName,
        Compte: compte,
        Banner: banner
      };

      const btn = document.querySelector('.AjouterOilCo');
      btn.disabled = true;
      btn.textContent = 'Ajout...';

      try {
        const csrf = getCSRF();
        const res = await fetch('/api/petrolieres/addOilCo', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json',
            'X-CSRF-Token': csrf
          },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          const txt = await res.text();
          throw new Error(txt || ('HTTP ' + res.status));
        }

        alert(`Pétrolière ${oilCoName} ajoutée avec succès ✅`);
        // Reset form
        document.getElementById('oilCoName').value = '';
        document.getElementById('compte').value = '';
        document.getElementById('banner').value = '';

        // Reload data
        await loadAll();
        applyFilter();
      } catch (e) {
        alert('Erreur ajout: ' + (e.message || e));
      } finally {
        btn.disabled = false;
        btn.textContent = 'Ajouter';
      }
    }
    
    // Init
    (async function init() {
      try {
        await loadAll();
        applyFilter();
        document.getElementById('f-name').addEventListener('input', applyFilter);
        document.querySelector('.AjouterOilCo').addEventListener('click', addOilCo);
      } catch (e) {
        alert('Erreur chargement: ' + e.message);
      }
    })();
    </script>
</body>




</html>
