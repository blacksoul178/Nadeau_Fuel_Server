{{define "pageTabs"}}
<nav class="tabs">
    <a href="/bulletin" class="tab">Bulletin</a>
    {{ if not .IsReports }}
    <a href="/chauffeurs" class="tab">Chauffeurs</a>
    <a href="/cartes" class="tab">Cartes</a>
    <a href="/brokers" class="tab">Compagnies Broker</a>
    <a href="/vehicules" class="tab">Véhicules</a>
    <a href="/taux" class="tab">Taux</a>
    <!--a href="/peages" class="tab">Péages</a>
    <a href="/camionsBroker" class="tab">Camions Broker</a-->
    {{ if or .IsAdmin .IsSuperUser }}
    <div class="tab-spacer"></div>
    <a href="/transactions" class="tab">Transactions</a>
    <a href="/petrolieres" class="tab">Pétrolières</a>
    <a href="/prixFuel" class="tab">Prix Fuel</a>
    <a href="/villes" class="tab">Villes</a>
    <a href="/rampe" class="tab">Prix à la rampe</a>
    <a href="/cartesPret" class="tab">Cartes de prêt</a>
    {{end}}
    {{end}}
</nav>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const currentPath = window.location.pathname;
    document.querySelectorAll('.tabs a[href]').forEach(function (link) {
      const href = link.getAttribute('href');
      if (href === currentPath || (href !== '/' && currentPath.startsWith(href + '/'))) {
        link.classList.add('active');
      }
    });
  });
</script>
{{end}}
