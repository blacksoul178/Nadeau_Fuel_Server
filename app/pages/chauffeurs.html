<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel'O'Matic - Chauffeurs</title>
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
 {{template "header" .}}

<main class="container">
  <!-- Filters -->
    <section class="panel">
      <div>
        <label for="f-name">Nom</label>
        <input type="text" id="f-name" placeholder="ex.: Martin">
      </div>
      <div>
        <label for="f-group">Groupe</label>
        <select id="f-group">
          <option value="">Tous</option>
          <option value="TGN">TGN</option>
          <option value="TMC">TMC</option>
          <option value="GJF">GJF</option>
          <option value="MTA">MTA</option>
          <option value="9001">9001</option>
        </select>
      </div>
      <div>
        <label for="f-isBroker">Broker?</label>
        <select id="f-isBroker">
          <option value="">Tous</option>
          <option value="true">Oui</option>
          <option value="false">Non</option>
        </select>
      </div>
      <button type="syncDrivers" class="sync-btn">Synchroniser</button>
      <div class="spacer"></div>
      <span id="count" style="opacity:.7;"></span>
      <button id="reset-filters" style="margin-left: 10px; padding: 5px 10px; cursor: pointer;">Réinitialiser filtres</button>
    </section>
    
    <!-- Table -->
    <section class="panel">
      <table id="tbl" class="table">
        <thead>
          <tr>
            <th># Opérateur</th>
            <th>Nom</th>
            <th>Groupe</th>
            <th>Broker</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script>
    const state = { data: [] };

    // Fetch ALL once (small table)
    async function loadAll() {
      const res = await fetch('/api/chauffeurs/all', { headers: { 'Accept': 'application/json' } });
      if (!res.ok)throw new Error('HTTP ' + res.status);
      state.data = await res.json();
    }

    //helper for for bool mismatch
      const toBoolOrNull = (v) => {
        if (v === null || v === undefined || v === '') return null;
        if (typeof v === 'boolean') return v;
        if (typeof v === 'number') return v !== 0;
        if (typeof v === 'string') {
          const s = v.trim().toLowerCase();
          if (['true','1','yes','y','oui'].includes(s)) return true;
          if (['false','0','no','n','non'].includes(s)) return false;
        }
        return null; // unknown -> treat as null
      };

    // Apply client-side filter
    function applyFilter() {
      const name = (document.getElementById('f-name').value || '').trim().toLowerCase();
      const grp  = (document.getElementById('f-group').value || '');
      const broker = (document.getElementById('f-isBroker').value || '');

      // Save filter state to localStorage
      try {
        localStorage.setItem('chauffeurs_filter_name', document.getElementById('f-name').value || '');
        localStorage.setItem('chauffeurs_filter_group', document.getElementById('f-group').value || '');
        localStorage.setItem('chauffeurs_filter_broker', document.getElementById('f-isBroker').value || '');
      } catch (e) {}

      let rows = state.data;
      
      if (name) {
        rows = rows.filter(r => {
          const combined = `${r.Nom ?? ''} ${r.operatorNo ?? ''}`  // combine both
            .toString()
            .toLowerCase();
          return combined.includes(name);
        });
      }

      if (grp) rows = rows.filter(r => (r.Groupe || '') === grp);
      
      if (broker !== '') {
            const want = broker === 'true';
            rows = rows.filter(r => toBoolOrNull(r.isBroker) === want);
          }


      render(rows);
    }

    // Render table
    function render(rows) {
      const tb = document.querySelector('#tbl tbody');
      tb.innerHTML = '';
      rows.forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${r.operatorNo ?? ''}</td>
          <td>${escapeHtml(r.Nom ?? '')}</td>
          <td>${r.Groupe ?? ''}</td>
          <td>${toBoolOrNull(r.isBroker) ? 'Oui' : 'Non'}</td>
        `;
        // Add click listener to toggle selection
        tr.addEventListener('click', function() {
          this.classList.toggle('selected');
        });
        tb.appendChild(tr);
      });
      document.getElementById('count').textContent = rows.length + ' résultat(s)';
    }

    // Utility
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function getCookie(name) {
      const v = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
      return v ? v.pop() : '';
    }

    async function syncDrivers() {

      try {
        const csrf = getCookie('csrf_token');
        const res = await fetch('/api/drivers/sync', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json',
            'X-CSRF-Token': csrf
          }
        });

        if (!res.ok) {
          const txt = await res.text();
          throw new Error(txt || ('HTTP ' + res.status));
        }

        alert('Synchronisation des chauffeurs enclanché, attendre une minute et rafraichir la page ✅');
      }
     catch (e) {
        alert('Erreur du démarrage de la synchronisation: ' + (e.message || e));
      }
    }


    // Init
    (async function init() {
      try {
        await loadAll();
        // Restore filter state from localStorage
        try {
          const savedName = localStorage.getItem('chauffeurs_filter_name');
          const savedGroup = localStorage.getItem('chauffeurs_filter_group');
          const savedBroker = localStorage.getItem('chauffeurs_filter_broker');
          
          if (savedName !== null) document.getElementById('f-name').value = savedName;
          if (savedGroup !== null) document.getElementById('f-group').value = savedGroup;
          if (savedBroker !== null) document.getElementById('f-isBroker').value = savedBroker;
        } catch (e) {}
        applyFilter();
        document.getElementById('f-name').addEventListener('input', applyFilter);
        document.getElementById('f-group').addEventListener('change', applyFilter);
        document.getElementById('f-isBroker').addEventListener('change', applyFilter);
        // Reset filters button
        document.getElementById('reset-filters').addEventListener('click', () => {
          try {
            localStorage.removeItem('chauffeurs_filter_name');
            localStorage.removeItem('chauffeurs_filter_group');
            localStorage.removeItem('chauffeurs_filter_broker');
          } catch (e) {}
          document.getElementById('f-name').value = '';
          document.getElementById('f-group').value = '';
          document.getElementById('f-isBroker').value = '';
          applyFilter();
        });
        const SyncDriversBtn = document.querySelector('.sync-btn');
        if (SyncDriversBtn) {
          SyncDriversBtn.addEventListener('click', syncDrivers);
        }
      } catch (e) {
        alert('Erreur chargement: ' + e.message);
      }
    })();
  </script>
</body>



</html>
