<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel'O'Matic - Prix à la rampe</title>
    <link rel="stylesheet" href="/assets/style.css">
</head>

<body>
 {{template "header" .}}


<main class="container">
    <style>
      .gros  { color: #1a7f37; font-weight: 600; }
      .petit { color: #d9730d; font-weight: 600; }
      .sep   { color: #999; padding: 0 4px; }
      #tbl td.prix { white-space: nowrap; }
    </style>
    <label for="panel">Prix Rack: <br>
        <span class="gros">Gros réservoir</span>: Rack Valéro - 0.1075$/L<br>
        <span class="petit">Petits réservoirs</span>: Rack Valéro - 0.0355$/L</label>
<section class="panel" style="overflow-x:auto">
      <table id="tbl" class="table">
        <thead>
          <tr>
            <th class="col-120">Date</th>
            <th class="col-200">ULSDQC1</th>
            <th class="col-200">Coloré (B)</th>
            <th class="col-200">Coloré -40</th>
            <th class="col-200">Mazout Int</th>
            <th class="col-200">Mazout Ext</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>


  <script>
    const state = { data: [] };

    function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    // "prix | gros (vert) | petit (orange)"; tiret si le prix n'existe pas (anciennes dates)
    function cell(prix, gros, petit) {
      if (!prix) return '<span class="sep">—</span>';
      return `${escapeHtml(prix)}<span class="sep">|</span>` +
             `<span class="gros">${escapeHtml(gros)}</span><span class="sep">|</span>` +
             `<span class="petit">${escapeHtml(petit)}</span>`;
    }

    async function loadAll() {
      const res = await fetch('/api/rampe/allRampe', { headers: { 'Accept': 'application/json' } });
      if (!res.ok)throw new Error('HTTP ' + res.status);
      state.data = await res.json();
    }


    function render(rows) {
      const tb = document.querySelector('#tbl tbody');
      tb.innerHTML = '';
      rows.forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${escapeHtml(r.Date)}</td>
          <td class="prix">${cell(r.ULSDQC1, r.GrosReservoir, r.PetitReservoir)}</td>
          <td class="prix">${cell(r.ColoreB, r.ColoreBGros, r.ColoreBPetit)}</td>
          <td class="prix">${cell(r.Colore40, r.Colore40Gros, r.Colore40Petit)}</td>
          <td class="prix">${cell(r.MazoutInt, r.MazoutIntGros, r.MazoutIntPetit)}</td>
          <td class="prix">${cell(r.MazoutExt, r.MazoutExtGros, r.MazoutExtPetit)}</td>
          `;
          // Add click listener to toggle selection
        tr.addEventListener('click', function() {
          this.classList.toggle('selected');
        });
        tb.appendChild(tr);
      });
    }

    // Init
    (async function init() {
      try {
        await loadAll();
        let rows = state.data
        render(rows)
      } catch (e) {
        alert('Erreur de chargement: ' + e.message);
      }
    })();


  </script>
