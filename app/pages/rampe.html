<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel'O'Matic - Prix à la rampe</title>
    <link rel="stylesheet" href="/assets/style.css">
</head>

<body>
 {{template "header" .}}


<main class="container">
    <label for="panel">Prix attendu: <br>
        Gros réservoir: Rack Valéro - 0.1075$/L<br>
    Petits réservoirs: Rack Valéro - 0.0355$/L</label>
<section class="panel">
      <table id="tbl" class="table">
        <thead>
          <tr>
            <th class="col-120">Date</th>
            <th class="col-80">ULSDQC1</th>
            <th class="col-200">GrosReservoir</th>
            <th class="col-200">PetitReservoir</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>


  <script>
    const state = { data: [] };

    async function loadAll() {
      const res = await fetch('/api/rampe/allRampe', { headers: { 'Accept': 'application/json' } });
      if (!res.ok)throw new Error('HTTP ' + res.status);
      state.data = await res.json();
    }


    function render(rows) {
      const tb = document.querySelector('#tbl tbody');
      tb.innerHTML = '';
      rows.forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${r.Date ?? ''}</td>
          <td>${r.ULSDQC1 ?? ''}</td>
          <td>${r.GrosReservoir ?? ''}</td>
          <td>${r.PetitReservoir ?? ''}</td>
          `;
          // Add click listener to toggle selection
        tr.addEventListener('click', function() {
          this.classList.toggle('selected');
        });
        tb.appendChild(tr);
      });
    }

    // Init
    (async function init() {
      try {
        await loadAll();
        let rows = state.data
        render(rows)
      } catch (e) {
        alert('Erreur de chargement: ' + e.message);
      }
    })();


  </script>
