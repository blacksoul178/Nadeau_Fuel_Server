<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DB Fuel - Nadeau</title>
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
    <header>
        <div>
            <h1>DB Fuel - Nadeau</h1>
        </div>
        <div class="user-info">
            {{.Username}}
            <span class="role-badge {{.Role}}">{{.Role}}</span>
        <form action="/logout" method="POST">
        <!-- CSRF Token for logout -->
        <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}" />
        <button type="submit" class="logout-btn">Logout</button>
        </div>
    </form>
</header>
<br>

<section id="content">
    <h2>Bienvenue {{.Username}}</h2> 
    {{if .IsAdmin}}
    <div class="admin-section">
        <h3>Admin Panel</h3>
        <p>You have admin access. You can manage:</p>
            <nav>
                <a href="/admin">Admin Dashboard</a>
                <a href="/admin/users">Manage Users</a>
            </nav>
        </div>
        {{end}}
        <h4>Navigation</h4>
        
        <nav class="tabs">
            <a href="/chauffeurs"    class="tab{{if eq .ActiveTab "chauffeurs"}} active{{end}}">Chauffeurs</a>
    <a href="/cartes"        class="tab{{if eq .ActiveTab "cartes"}} active{{end}}">Cartes</a>
    <a href="/transactions"  class="tab{{if eq .ActiveTab "transactions"}} active{{end}}">Transactions</a>
    <a href="/petrolieres"   class="tab{{if eq .ActiveTab "petrolieres"}} active{{end}}">Pétrolières</a>
    <a href="/vehicules"     class="tab{{if eq .ActiveTab "vehicules"}} active{{end}}">Véhicules</a>
    <a href="/brokers"       class="tab{{if eq .ActiveTab "brokers"}} active{{end}}">Compagnies Broker</a>
</nav>

</section>



</body>
</html>
