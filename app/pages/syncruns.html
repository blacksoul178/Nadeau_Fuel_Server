<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel'O'Matic - Syncruns</title>
    <link rel="stylesheet" href="/assets/style.css">
</head>

<style>
  #tbl td:nth-child(1), #tbl th:nth-child(1) {
    width: 10%;
  }
  #tbl td:nth-child(2), #tbl th:nth-child(2) {
    width: 10%;
  }
  #tbl td:nth-child(3), #tbl th:nth-child(3) {
    width: 10%;
  }
  #tbl td:nth-child(4), #tbl th:nth-child(4) {
    width: 10%;
  }
  #tbl td:nth-child(5), #tbl th:nth-child(5) {
    width: 60%;
    text-overflow: ellipsis;
    white-space: wrap;
  }
</style>

<body>
 {{template "header" .}}


<main class="container">
  <!-- Filters -->
  <section class="panel">
    <div>
      <label for="f-name">Synchros</label>
    </section>

    <!-- Table -->
    <section class="panel">
      <table id="tbl" class="table">
        <thead>
          <tr>
            <th>Nom</th>
            <th>Date de début</th>
            <th>Date de fin</th>
            <th>Status</th>
            <th>Error</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script>
    const state = { data: [] };

    // Fetch ALL once (small table)
    async function loadAll() {
      const res = await fetch('/api/admin/syncrunsError', { headers: { 'Accept': 'application/json' } });
      if (!res.ok)throw new Error('HTTP ' + res.status);
      state.data = await res.json();
    }


    // Render table
    function render(rows) {
      const tb = document.querySelector('#tbl tbody');
      tb.innerHTML = '';
      rows.forEach(r => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${r.RunName ?? ''}</td>
          <td>${r.StartedAt ?? ''}</td>
          <td>${r.FinishedAt ?? ''}</td>
          <td>${r.Status ?? ''}</td>
          <td>${r.ErrorMessage ?? ''}</td>
          `;
          // Add click listener to toggle selection
        tr.addEventListener('click', function() {
          this.classList.toggle('selected');
        });
        tb.appendChild(tr);
      });
    }
    
    
    // Init
    (async function init() {
      try {
        await loadAll();
        let rows = state.data
        render(rows)
      } catch (e) {
        alert('Erreur chargement: ' + e.message);
      }
    })();
    </script>
</body>




</html>
